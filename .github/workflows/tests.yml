name: Django CI/CD - Backend Tests & Lint

on:
  push:
    branches: [ main, develop, 'features/**']
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 pytest pytest-cov

      - name: Run Black (formatting check)
        run: black puzzle_backend

      - name: Run Flake8 (linting)
        run: flake8 puzzle_backend

      - name: Run Pytest with coverage
        run: |
          cd puzzle_backend
          pytest --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=80 --cov-branch-cov-

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: puzzle_backend/coverage.xml
          fail_ci_if_error: true
